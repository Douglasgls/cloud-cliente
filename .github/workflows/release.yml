name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            asset_name: cloud-client-linux.zip
            build_cmd: wails build -tags webkit2_41
          - os: windows-latest
            platform: windows
            asset_name: cloud-client-windows.zip
            build_cmd: wails build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Install Linux Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config build-essential

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build App
        run: ${{ matrix.build_cmd }}

      - name: Package Release Assets (Linux)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p release-dist
          cp build/bin/cloud-client release-dist/
          cp -r assets release-dist/
          if [ -f .env ]; then cp .env release-dist/; else cp .env.example release-dist/.env; fi
          cd release-dist
          zip -r ../cloud-client-linux.zip *

      - name: Package Release Assets (Windows)
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path release-dist -Force
          Copy-Item -Path build/bin/cloud-client.exe -Destination release-dist/
          Copy-Item -Path assets -Destination release-dist/ -Recurse
          if (Test-Path .env) { Copy-Item -Path .env -Destination release-dist/ } else { Copy-Item -Path .env.example -Destination release-dist/.env }
          Compress-Archive -Path release-dist/* -DestinationPath cloud-client-windows.zip

      - name: Release App Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

